server {
    # Listen on 3029 so Nginx Proxy Manager can forward segno.aquiles.dev here by
    # container name (segno-updates:3029) on a shared Docker network.
    listen 3029;
    server_name _;
    root /usr/share/nginx/html;

    # Update artifacts live under /updates/... (app-name-neutral, per #300):
    #   /updates/appliance/manifest.json   + *.raucb   (Pi OTA)
    #   /updates/macos/appcast.xml         + *.dmg/zip (Sparkle, later)
    #   /updates/windows/appcast.xml       + *.exe     (WinSparkle, later)
    location /updates/ {
        autoindex on;                 # directory listing — handy for debugging
        add_header Cache-Control "no-cache";   # always re-check the manifest/bundle
    }

    # Correct content types for the artifacts we serve.
    types {
        application/json                     json;
        application/xml                      xml;
        application/octet-stream             raucb dmg exe msix;
        text/plain                           txt;
    }
    default_type application/octet-stream;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
