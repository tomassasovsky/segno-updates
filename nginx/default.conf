server {
    # Listen on 3029; Nginx Proxy Manager forwards segno.aquiles.dev here.
    listen 3029;
    server_name _;
    root /usr/share/nginx/html;

    # text/plain default so extensionless responses (root, /healthz, error pages)
    # DISPLAY in the browser instead of downloading as an octet-stream blob. The
    # types{} below still serves the actual artifacts with the right binary types.
    default_type text/plain;
    types {
        application/json                     json;
        application/xml                      xml;
        application/octet-stream             raucb dmg exe msix;
        text/plain                           txt;
    }

    # Friendly root (otherwise the empty volume yields a 403 / a confusing page).
    location = / {
        return 200 "segno updates server\nsee /updates/appliance/<channel>/manifest.json\n";
    }

    # Update artifacts live under /updates/... (app-name-neutral, per #300):
    #   /updates/appliance/manifest.json   + *.raucb   (Pi OTA)
    #   /updates/macos/appcast.xml         + *.dmg/zip (Sparkle, later)
    #   /updates/windows/appcast.xml       + *.exe     (WinSparkle, later)
    location /updates/ {
        autoindex on;                 # directory listing — handy for debugging
        add_header Cache-Control "no-cache";   # always re-check the manifest/bundle
    }

    # On-demand mirror trigger (CI calls this after publishing a GitHub Release).
    # Authenticated inside segno-mirror via SYNC_TOKEN; long timeout for .raucb fetch.
    location = /hooks/sync {
        limit_except POST { deny all; }
        proxy_pass http://segno-mirror:8080/sync;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_body on;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        return 200 "ok\n";
    }
}
