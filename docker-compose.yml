# Loopy / segno update server. Self-contained (no host-file binds — Portainer-safe):
#   segno-updates  — nginx image with the config baked in, serves /updates/... on 3029
#   segno-mirror   — polls the GitHub Releases API, writes artifacts into the shared
#                    named volume that nginx serves
# Deploy as a Portainer *git repository* stack (both services build). See README.md.
services:
  segno-updates:
    build: ./nginx
    container_name: segno-updates
    restart: unless-stopped
    ports:
      - "3029:3029"          # host 3029 -> nginx (listens on 3029; see nginx/default.conf)
    volumes:
      - updates-www:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3029/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  segno-mirror:
    build: ./sync
    container_name: segno-mirror
    restart: unless-stopped
    environment:
      GITHUB_REPO: "tomassasovsky/loopy"
      POLL_INTERVAL: "300"      # seconds between GitHub Releases polls
      WWW_DIR: "/www"
      # GITHUB_TOKEN: "..."     # set (Portainer env / secret) if releases are private
    volumes:
      - updates-www:/www        # read-write: the mirror writes updates/appliance/<channel>/

# Shared named volume: the mirror populates it, nginx serves it. Persists across
# redeploys (unlike a repo-clone bind) and needs no host files to pre-exist.
volumes:
  updates-www:
